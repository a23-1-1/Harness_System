#!/bin/bash
# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — DB Demo Studio 完整部署方案
# ═══════════════════════════════════════════════════════════════
# 使用方式：
#   docker compose up -d              # 启动所有服务
#   docker compose up -d --build      # 重新构建镜像并启动
#   docker compose down               # 停止所有服务
#   docker compose logs -f            # 查看所有日志
# ═══════════════════════════════════════════════════════════════

version: "3.9"

# ─── 共享网络 ──────────────────────────────────────────────────
networks:
  db-demo-network:
    driver: bridge
    name: db-demo-network

# ─── 数据卷 ────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: db-demo-postgres-data
  redis-data:
    name: db-demo-redis-data

# ─── 服务 ──────────────────────────────────────────────────────
services:

  # ═════════════════════════════════════════════════════════════
  # 1. PostgreSQL 16 — 主存储 + pgvector
  # ═════════════════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: db-demo-postgres
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      POSTGRES_USER: ${PG_USER:-dbdemo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dbdemo_pass}
      POSTGRES_DB: ${PG_DATABASE:-db_demo_studio}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dbdemo} -d ${PG_DATABASE:-db_demo_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════
  # 2. Redis 7+ — 会话缓存 / Pub/Sub / LLM Cache / 限流
  # ═════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: db-demo-redis
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./docker/backend/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════
  # 3. FastAPI 后端
  # ═════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: db-demo-backend
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 容器内使用服务名连接，而非 localhost
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-dbdemo}:${PG_PASSWORD:-dbdemo_pass}@postgres:5432/${PG_DATABASE:-db_demo_studio}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PG_HOST: postgres
      PG_PORT: 5432
      # EXPLAIN 引擎（Linux 部署时改为主机 IP）
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      PG_EXPLAIN_HOST: ${PG_EXPLAIN_HOST:-host.docker.internal}
      # LLM
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      # 应用配置
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v5/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════
  # 4. React 19 前端（Nginx 托管）
  # ═════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
        - APP_ENV=${APP_ENV:-production}
    container_name: db-demo-frontend
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
