# docker-compose.yml - DB Demo Studio full deployment
# Usage:
#   docker compose up -d
#   docker compose up -d --build
#   docker compose down
#   docker compose logs -f

networks:
  db-demo-network:
    driver: bridge
    name: db-demo-network

volumes:
  postgres-data:
    name: db-demo-postgres-data
  redis-data:
    name: db-demo-redis-data
  mysql-explain-data:
    name: db-demo-mysql-explain-data
  pgexplain-data:
    name: db-demo-pgexplain-data

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: db-demo-postgres
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      POSTGRES_USER: ${PG_USER:-dbdemo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dbdemo_pass}
      POSTGRES_DB: ${PG_DATABASE:-db_demo_studio}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dbdemo} -d ${PG_DATABASE:-db_demo_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: db-demo-redis
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./docker/backend/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: db-demo-backend
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-dbdemo}:${PG_PASSWORD:-dbdemo_pass}@postgres:5432/${PG_DATABASE:-db_demo_studio}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PG_HOST: postgres
      PG_PORT: 5432
      MYSQL_HOST: mysql-explain
      PG_EXPLAIN_HOST: pgexplain
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v5/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-explain:
    image: mysql:8.0
    container_name: db-demo-mysql-explain
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-explain-data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: explain_test
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgexplain:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: db-demo-pgexplain
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${PG_EXPLAIN_PORT:-5433}:5432"
    volumes:
      - pgexplain-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: explain
      POSTGRES_PASSWORD: explain_pass
      POSTGRES_DB: explain_test
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explain -d explain_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
        - APP_ENV=${APP_ENV:-production}
    container_name: db-demo-frontend
    restart: unless-stopped
    networks:
      - db-demo-network
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
