# ═══════════════════════════════════════════════════════════════
# redis.conf — Redis 配置
# ═══════════════════════════════════════════════════════════════

# 绑定所有网卡（Docker 内安全）
bind 0.0.0.0

# 保护模式
protected-mode yes

# 端口
port 6379

# 持久化 RDB
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 内存管理
maxmemory 512mb
maxmemory-policy allkeys-lru

# 连接
timeout 0
tcp-keepalive 300
maxclients 1000

# 日志
loglevel notice
logfile ""

# AOF 持久化（可选——需要高可靠性时启用）
# appendonly yes
# appendfsync everysec

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 通知 keyspace 事件（Pub/Sub 广播需要）
notify-keyspace-events Ksg
